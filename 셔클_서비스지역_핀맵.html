<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>셔클 서비스 지역 현황</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060d18;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 44px;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }
    h1 { color: #d5e8f5; font-size: 20px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.3px; }
    .sub { color: #2d4e62; font-size: 12px; margin-bottom: 20px; }
    .stats {
      display: flex; gap: 16px; margin-bottom: 24px;
    }
    .stat {
      background: #0f1e2e;
      border: 1px solid #1a3248;
      border-radius: 10px;
      padding: 12px 24px;
      text-align: center;
    }
    .stat-num { color: #3b82f6; font-size: 26px; font-weight: 800; }
    .stat-label { color: #5a8aa0; font-size: 11px; margin-top: 3px; }
    .map-wrap {
      position: relative;
      max-width: 760px;
      width: 100%;
    }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .korea-land { fill: #0f2035; stroke: #1e4060; stroke-width: 1.5; }
    .island { fill: #0f2035; stroke: #1e4060; stroke-width: 1.2; }
    .pin { cursor: pointer; }
    .pin-dot {
      fill: #ef4444;
      stroke: #fff;
      stroke-width: 1.5;
      transition: all 0.15s;
    }
    .pin:hover .pin-dot {
      fill: #fbbf24;
      r: 7;
      stroke-width: 2;
    }
    .tooltip {
      position: fixed;
      background: rgba(10, 20, 35, 0.95);
      color: #d5e8f5;
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      pointer-events: none;
      display: none;
      border: 1px solid #2563eb;
      z-index: 100;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    .tooltip .sub-t { color: #5a8aa0; font-size: 11px; font-weight: 400; margin-top: 2px; }
    .legend {
      display: flex;
      gap: 20px;
      margin-top: 16px;
      align-items: center;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7aafc8; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; border: 1.5px solid #fff; flex-shrink: 0; }
  </style>
</head>
<body>

<!-- Tooltip -->
<div class="tooltip" id="tooltip"></div>

<script>
  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('.pin').forEach(pin => {
    pin.addEventListener('mouseenter', (e) => {
      const name = pin.dataset.name;
      const count = pin.dataset.count;
      tooltip.innerHTML = `<div>${name}</div><div class="sub-t">세부 지역 ${count}</div>`;
      tooltip.style.display = 'block';
    });
    pin.addEventListener('mousemove', (e) => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY - 10) + 'px';
    });
    pin.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
    });
  });
</script>
