<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>셔클 서비스 지역 현황</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; background: #f0f2f5; }
    #map { height: 100vh; width: 100%; }

    .info-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 1000;
      background: rgba(8, 16, 28, 0.92);
      border-radius: 12px;
      padding: 16px 20px;
      color: #d5e8f5;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(59, 130, 246, 0.2);
      min-width: 220px;
    }
    .info-title { font-size: 15px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.3px; }
    .info-sub { font-size: 11px; color: #5a8aa0; margin-bottom: 12px; }
    .info-stats { display: flex; gap: 12px; }
    .stat { text-align: center; }
    .stat-num { font-size: 24px; font-weight: 800; color: #3b82f6; line-height: 1; }
    .stat-label { font-size: 10px; color: #7aafc8; margin-top: 2px; }

    .legend-panel {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 1000;
      background: rgba(8, 16, 28, 0.88);
      border-radius: 10px;
      padding: 12px 16px;
      color: #d5e8f5;
      font-size: 11px;
      border: 1px solid rgba(59, 130, 246, 0.15);
    }
    .legend-title { font-size: 11px; color: #5a8aa0; margin-bottom: 8px; font-weight: 600; }
    .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
    .legend-circle { border-radius: 50%; background: #ef4444; border: 1.5px solid #fff; flex-shrink: 0; }

    /* Leaflet popup custom */
    .leaflet-popup-content-wrapper {
      background: rgba(8, 16, 28, 0.96);
      color: #d5e8f5;
      border-radius: 8px;
      border: 1px solid #2563eb;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .leaflet-popup-tip { background: rgba(8, 16, 28, 0.96); }
    .leaflet-popup-content { margin: 10px 14px; }
    .popup-name { font-size: 14px; font-weight: 700; color: #d5e8f5; }
    .popup-count { font-size: 12px; color: #5a8aa0; margin-top: 4px; }
    .popup-count span { color: #3b82f6; font-weight: 700; }

    .leaflet-tooltip {
      background: rgba(8, 16, 28, 0.9) !important;
      border: 1px solid #2563eb !important;
      color: #d5e8f5 !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif !important;
      border-radius: 6px !important;
      padding: 4px 8px !important;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important;
    }
    .leaflet-tooltip::before { border-top-color: #2563eb !important; }
  </style>
</head>
<body>

<div id="map"></div>

<div class="info-panel">
  <div class="info-title">셔클 서비스 지역 현황</div>
  <div class="info-sub">2026년 8월 기준 · 핀 클릭 시 상세 확인</div>
  <div class="info-stats">
    <div class="stat"><div class="stat-num">40</div><div class="stat-label">지자체</div></div>
    <div class="stat" style="border-left:1px solid #1a3248; padding-left:12px;">
      <div class="stat-num">97</div><div class="stat-label">세부 지역</div>
    </div>
  </div>
</div>

<div class="legend-panel">
  <div class="legend-title">세부 지역 수</div>
  <div class="legend-item"><div class="legend-circle" style="width:8px;height:8px;"></div> 1개</div>
  <div class="legend-item"><div class="legend-circle" style="width:11px;height:11px;"></div> 2~3개</div>
  <div class="legend-item"><div class="legend-circle" style="width:14px;height:14px;"></div> 4~5개</div>
  <div class="legend-item"><div class="legend-circle" style="width:17px;height:17px;"></div> 6~7개</div>
</div>

<script>
// 지도 초기화
var map = L.map('map', {
  center: [36.5, 127.8],
  zoom: 7,
  zoomControl: true
});

// 지도 타일 (CartoDB Positron — 깨끗한 라이트 지도)
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
  subdomains: 'abcd',
  maxZoom: 19
}).addTo(map);

// 서비스 지역 데이터
var locations = [
  { name: '서울특별시',        lat: 37.57,  lon: 127.00, count: 1 },
  { name: '고양시',            lat: 37.66,  lon: 126.84, count: 4 },
  { name: '의정부시',          lat: 37.74,  lon: 127.04, count: 2 },
  { name: '양주시',            lat: 37.79,  lon: 126.98, count: 5 },
  { name: '연천군',            lat: 38.09,  lon: 127.07, count: 1 },
  { name: '파주시',            lat: 37.83,  lon: 126.77, count: 4 },
  { name: '김포시',            lat: 37.64,  lon: 126.71, count: 1 },
  { name: '인천광역시',        lat: 37.46,  lon: 126.71, count: 1 },
  { name: '부천시',            lat: 37.50,  lon: 126.79, count: 2 },
  { name: '광명시',            lat: 37.48,  lon: 126.87, count: 2 },
  { name: '안양시',            lat: 37.39,  lon: 126.95, count: 2 },
  { name: '시흥시',            lat: 37.38,  lon: 126.80, count: 2 },
  { name: '의왕시',            lat: 37.35,  lon: 126.97, count: 1 },
  { name: '수원시',            lat: 37.26,  lon: 127.03, count: 5 },
  { name: '하남시',            lat: 37.54,  lon: 127.22, count: 2 },
  { name: '광주시(경기)',       lat: 37.43,  lon: 127.26, count: 7 },
  { name: '화성시',            lat: 37.19,  lon: 126.83, count: 6 },
  { name: '안산시',            lat: 37.32,  lon: 126.83, count: 3 },
  { name: '용인시',            lat: 37.23,  lon: 127.20, count: 3 },
  { name: '이천시',            lat: 37.27,  lon: 127.44, count: 6 },
  { name: '여주시',            lat: 37.30,  lon: 127.63, count: 5 },
  { name: '평택시',            lat: 37.00,  lon: 127.11, count: 3 },
  { name: '안성시',            lat: 37.00,  lon: 127.27, count: 4 },
  { name: '서산시',            lat: 36.78,  lon: 126.45, count: 2 },
  { name: '아산시',            lat: 36.79,  lon: 127.00, count: 1 },
  { name: '보령시',            lat: 36.33,  lon: 126.61, count: 2 },
  { name: '충북혁신도시',      lat: 36.85,  lon: 127.43, count: 1 },
  { name: '세종시',            lat: 36.48,  lon: 127.29, count: 4 },
  { name: '공주시',            lat: 36.45,  lon: 127.12, count: 1 },
  { name: '부여군',            lat: 36.27,  lon: 126.91, count: 1 },
  { name: '대전광역시',        lat: 36.35,  lon: 127.38, count: 1 },
  { name: '충청남도(금산군)',   lat: 36.11,  lon: 127.49, count: 1 },
  { name: '제천시',            lat: 37.13,  lon: 128.21, count: 1 },
  { name: '양구군',            lat: 38.11,  lon: 127.99, count: 1 },
  { name: '강릉시',            lat: 37.75,  lon: 128.88, count: 1 },
  { name: '영덕군',            lat: 36.52,  lon: 129.37, count: 1 },
  { name: '새만금단지',        lat: 35.80,  lon: 126.65, count: 1 },
  { name: '광주광역시',        lat: 35.16,  lon: 126.85, count: 3 },
  { name: '영암군',            lat: 34.80,  lon: 126.70, count: 1 },
  { name: '울릉군',            lat: 37.50,  lon: 130.87, count: 1 },
];

// 세부 지역 수에 따른 반지름
function getRadius(count) {
  if (count >= 6) return 10;
  if (count >= 4) return 8;
  if (count >= 2) return 6.5;
  return 5;
}

// 마커 추가
locations.forEach(function(loc) {
  var marker = L.circleMarker([loc.lat, loc.lon], {
    radius: getRadius(loc.count),
    fillColor: '#ef4444',
    color: '#ffffff',
    weight: 1.8,
    opacity: 1,
    fillOpacity: 0.92
  }).addTo(map);

  // 팝업 (클릭)
  marker.bindPopup(
    '<div class="popup-name">' + loc.name + '</div>' +
    '<div class="popup-count">세부 지역 <span>' + loc.count + '개</span></div>',
    { maxWidth: 180 }
  );

  // 툴팁 (hover)
  marker.bindTooltip(loc.name, {
    permanent: false,
    direction: 'top',
    offset: [0, -4]
  });
});
</script>

</body>
</html>
