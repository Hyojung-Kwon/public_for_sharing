const STCFG={
  main:{name:'Main Stage',hall:'Hall 18',cls:'main',bc:'b-main'},
  ind: {name:'Industry Stage',hall:'Hall 13',cls:'ind',bc:'b-ind'},
  proto:{name:'prototype.club Stage',hall:'Hall 12',cls:'proto',bc:'b-proto'},
};
const L={
  ko:{tag:'행사 일정',sub:'독일 하노버 · 2026년 9월 15–18일',priv:'비공개 행사',note_ev:'이브닝 행사',iaa_link:'IAA 일정 바로가기',cnt_sfx:'개 세션'},
  en:{tag:'Event Schedule',sub:'Hannover, Germany · September 15–18, 2026',priv:'Private Event',note_ev:'Evening Event',iaa_link:'View on IAA website',cnt_sfx:' sessions'},
};


let lang='en', curDay='d15';

function groupByTime(sessions){
  const map={};
  sessions.forEach(s=>{if(!map[s.s])map[s.s]=[];map[s.s].push(s);});
  return Object.entries(map).sort((a,b)=>tm(a[0])-tm(b[0]));
}

function card(ses){
  const Ll=L[lang];
  const cfg=STCFG[ses.g];
  const title=lang==='ko'?ses.tk:ses.t;
  const cls=ses.priv?'priv':cfg.cls;
  const privBadge=ses.priv?`<span class="badge b-priv">${Ll.priv}</span>`:'';
  const noteBadge=ses.note?`<span class="badge b-note">${lang==='ko'?Ll.note_ev:ses.note}</span>`:'';
  const spHtml=ses.sp
    ?`<div class="card-speakers">${ses.sp.split('·').map(s=>`<div class="sp-line">${s.trim()}</div>`).join('')}</div>`
    :'';
  return `<div class="card ${cls}">
    <div class="card-meta">
      <span class="badge ${cfg.bc}">${cfg.name} · ${cfg.hall}</span>
      ${privBadge}${noteBadge}
      <span class="b-time">→ ${ses.e}</span>
    </div>
    <div class="card-title"><a href="${ses.url}" target="_blank">${title}</a></div>
    ${spHtml}
  </div>`;
}

function renderDay(day){
  const Ll=L[lang];
  const url=DAY_URLS[day.id];
  const dname=lang==='ko'?day.ko:day.en;
  const groups=groupByTime(day.sessions);
  const rows=groups.map(([time,sessions])=>{
    const latestEnd=sessions.map(s=>s.e).reduce((a,b)=>tm(a)>tm(b)?a:b);
    return `<div class="time-group">
      <div class="time-col">
        <div class="t-start">${time}</div>
        <div class="t-end">– ${latestEnd}</div>
      </div>
      <div class="cards-row">${sessions.map(card).join('')}</div>
    </div>`;
  }).join('');
  return `<div class="day-sec-hdr">
    <div class="day-sec-name">${dname}</div>
    <a class="day-sec-link" href="${url}" target="_blank">${Ll.iaa_link}</a>
  </div>
  <div class="sched">${rows}</div>`;
}

const TAB_LABELS={
  d15:{en:'9/15 (TUE)',ko:'9/15 (화)'},
  d16:{en:'9/16 (WED)',ko:'9/16 (수)'},
  d17:{en:'9/17 (THU)',ko:'9/17 (목)'},
  d18:{en:'9/18 (FRI)',ko:'9/18 (금)'}
};

function render(){
  const Ll=L[lang];
  document.getElementById('ev-sub').textContent=Ll.sub;
  document.getElementById('tabs').innerHTML=days.map(d=>
    `<button class="tab ${d.id===curDay?'on':''}" onclick="setDay('${d.id}')">${TAB_LABELS[d.id][lang]}</button>`
  ).join('');
  const day=days.find(d=>d.id===curDay);
  document.getElementById('root').innerHTML=renderDay(day);
}

function setLang(l){
  lang=l;
  document.getElementById('btn-ko').classList.toggle('on',l==='ko');
  document.getElementById('btn-en').classList.toggle('on',l==='en');
  render();
}
function setDay(id){curDay=id;render();}
setLang('en');
