<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울시 자율주행 서비스 — 로보택시·새벽동행버스</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060d18;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 44px;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }
    h1 { color: #d5e8f5; font-size: 20px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.3px; }
    .sub { color: #2d4e62; font-size: 12px; margin-bottom: 20px; }
    .map { max-width: 940px; width: 100%; border-radius: 14px; overflow: hidden; box-shadow: 0 16px 56px rgba(0,0,0,0.75); }
    svg { display: block; width: 100%; height: auto; }
    .legend { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px 20px; margin-top: 20px; max-width: 940px; width: 100%; }
    .li { display: flex; align-items: center; gap: 9px; }
    .b { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.15); }
    .lt { color: #aec8dc; font-size: 12.5px; }
    .ls { color: #6090aa; font-size: 10.5px; margin-top: 1px; }
  </style>
</head>
<body>

<h1>서울시 자율주행 서비스 현황</h1>
<div class="sub">로보택시 · 새벽동행버스 | 2026. 8. 기준</div>

<div class="map">
<svg viewBox="0 0 920 700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="gl" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="920" height="700" fill="#0b1825"/>
<rect x="0" y="418" width="920" height="282" fill="#090f1c" opacity="0.45"/>

<!-- Map title -->
<text x="24" y="36" fill="#7aafc8" font-size="15" font-weight="700" letter-spacing="1" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">로보택시 · 새벽동행버스</text>

<!-- Han River -->
<path d="M 0 422 C 95 406 195 423 330 430 C 440 436 535 422 648 416 C 755 410 845 422 920 418"
      fill="none" stroke="#0c2c42" stroke-width="46" stroke-linecap="round"/>
<path d="M 0 422 C 95 406 195 423 330 430 C 440 436 535 422 648 416 C 755 410 845 422 920 418"
      fill="none" stroke="#0e3450" stroke-width="28" stroke-linecap="round"/>
<text x="768" y="430" fill="#144060" font-size="13" font-style="italic">한 강</text>

<!-- Area labels -->
<text x="478" y="270" fill="#4a8ba4" font-size="15" text-anchor="middle">종로·중구</text>
<text x="352" y="610" fill="#4a8ba4" font-size="15" text-anchor="middle">동작·관악</text>
<text x="108" y="360" fill="#4a8ba4" font-size="15" text-anchor="middle">마포·서대문</text>
<text x="162" y="478" fill="#4a8ba4" font-size="15" text-anchor="middle">영등포</text>
<text x="604" y="490" fill="#4a8ba4" font-size="15" text-anchor="middle">강남·서초</text>
<text x="172" y="152" fill="#4a8ba4" font-size="15" text-anchor="middle">은평</text>
<text x="718" y="138" fill="#4a8ba4" font-size="15" text-anchor="middle">노원</text>

<!-- ② A160 : 도봉산역 ↔ 영등포역 (Blue) -->
<path d="M 680 40 L 636 132 C 600 192 560 248 514 294 L 448 326
         C 376 358 308 384 242 404 L 178 422"
      fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)" opacity="0.93"/>

<!-- ③ A741 : 구파발역 ↔ 양재역 (Purple) -->
<path d="M 176 175 C 238 252 318 326 420 392 C 482 432 540 476 598 504"
      fill="none" stroke="#a855f7" stroke-width="6" stroke-linecap="round" filter="url(#gl)" opacity="0.93"/>

<!-- ④ A148 : 상계역 ↔ 고속터미널역 (Green) -->
<path d="M 636 132 C 605 195 574 258 546 306 L 518 360
         C 498 392 484 410 472 424"
      fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#gl)" opacity="0.93"/>

<!-- ⑤ A504 : 금천구청 ↔ 서울시청 (Hot pink) -->
<path d="M 170 578 C 208 506 272 440 348 380 C 386 346 418 326 446 314"
      fill="none" stroke="#f01a72" stroke-width="6" stroke-linecap="round" filter="url(#gl)" opacity="0.93"/>

<!-- ⑥ 심야A21 : 합정역 ↔ 동대문역 (Cyan) -->
<path d="M 286 358 C 344 340 398 324 448 314 L 516 296"
      fill="none" stroke="#0891b2" stroke-width="6" stroke-linecap="round" filter="url(#gl)" opacity="0.93"/>

<!-- ① 강남 로보택시 서비스구역 (Red rect) -->
<rect x="484" y="450" width="218" height="152" rx="10"
      fill="#ef44440e" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="8,4"/>
<text x="593" y="530" fill="#ef4444" font-size="13" text-anchor="middle" font-weight="600">강남 로보택시</text>
<text x="593" y="546" fill="#ef4444" font-size="11" text-anchor="middle">서비스 구역</text>

<!-- SERVICE LABELS -->
<text x="555" y="210" fill="#2563eb" font-size="15" text-anchor="end" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">A160</text>
<text x="265" y="248" fill="#a855f7" font-size="15" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">A741</text>
<text x="532" y="284" fill="#16a34a" font-size="15" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">A148</text>
<text x="238" y="503" fill="#f01a72" font-size="15" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">A504</text>
<text x="320" y="332" fill="#0891b2" font-size="15" text-anchor="middle" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">심야A21</text>

<!-- STATIONS -->
<circle cx="680" cy="40" r="6.5" fill="#2563eb" stroke="#0b1825" stroke-width="2.5"/>
<text x="695" y="38" fill="#a5c5da" font-size="13">도봉산역</text>

<circle cx="636" cy="132" r="6" fill="#16a34a" stroke="#0b1825" stroke-width="2.5"/>
<text x="650" y="130" fill="#a5c5da" font-size="13">상계역</text>

<circle cx="516" cy="296" r="6" fill="#0891b2" stroke="#0b1825" stroke-width="2.5"/>
<text x="530" y="293" fill="#a5c5da" font-size="13">동대문역</text>

<circle cx="286" cy="358" r="6" fill="#0891b2" stroke="#0b1825" stroke-width="2.5"/>
<text x="268" y="372" fill="#a5c5da" font-size="13" text-anchor="middle">합정역</text>

<circle cx="176" cy="175" r="6" fill="#a855f7" stroke="#0b1825" stroke-width="2.5"/>
<text x="158" y="170" fill="#a5c5da" font-size="13" text-anchor="end" opacity="0.6">구파발역</text>

<circle cx="178" cy="422" r="6" fill="#2563eb" stroke="#0b1825" stroke-width="2.5"/>
<text x="160" y="436" fill="#a5c5da" font-size="13" text-anchor="end">영등포역</text>

<circle cx="472" cy="424" r="6" fill="#16a34a" stroke="#0b1825" stroke-width="2.5"/>
<text x="486" y="422" fill="#a5c5da" font-size="13">고속터미널</text>

<circle cx="598" cy="504" r="6" fill="#a855f7" stroke="#0b1825" stroke-width="2.5"/>
<text x="612" y="502" fill="#a5c5da" font-size="13">양재역</text>

<circle cx="170" cy="578" r="6" fill="#f01a72" stroke="#0b1825" stroke-width="2.5"/>
<text x="152" y="593" fill="#a5c5da" font-size="13" text-anchor="end">금천구청</text>

<circle cx="446" cy="314" r="5" fill="#f01a72" stroke="#0b1825" stroke-width="2"/>

</svg>
</div>

<div class="legend">
  <div class="li">
    <div class="b" style="background:#ef4444">①</div>
    <div><div class="lt">강남 로보택시</div><div class="ls">강남구·서초구 일대 / SWM · 카카오모빌리티</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#2563eb">②</div>
    <div><div class="lt">새벽동행버스 A160</div><div class="ls">도봉산역 ↔ 영등포역 / A2Z</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#a855f7">③</div>
    <div><div class="lt">새벽동행버스 A741</div><div class="ls">구파발역 ↔ 양재역 / A2Z</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#16a34a">④</div>
    <div><div class="lt">새벽동행버스 A148</div><div class="ls">상계역 ↔ 고속터미널역 / SUM</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#f01a72">⑤</div>
    <div><div class="lt">새벽동행버스 A504</div><div class="ls">금천구청 ↔ 서울시청 / SUM</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#0891b2">⑥</div>
    <div><div class="lt">심야A21</div><div class="ls">합정역 ↔ 동대문역 / SUM</div></div>
  </div>
</div>

</body>
</html>
