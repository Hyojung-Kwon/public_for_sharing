<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>셔클 자율주행 플랫폼</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: #060d18;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
  </style>
</head>
<body>

<svg viewBox="0 0 620 450" width="620" height="450"
  xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="55%">
    <stop offset="0%" stop-color="#0a1a30"/>
    <stop offset="100%" stop-color="#060d18"/>
  </radialGradient>
  <filter id="gl"><feGaussianBlur stdDeviation="3.5"/></filter>
  <!-- clip for logo boxes -->
  <clipPath id="clip-rf"><rect x="0" y="0" width="140" height="52" rx="8"/></clipPath>
  <clipPath id="clip-swm"><rect x="0" y="0" width="120" height="52" rx="8"/></clipPath>
  <clipPath id="clip-a2z"><rect x="0" y="0" width="130" height="52" rx="8"/></clipPath>
  <clipPath id="clip-kakao"><rect x="0" y="0" width="160" height="52" rx="8"/></clipPath>
  <clipPath id="clip-sum"><rect x="0" y="0" width="120" height="52" rx="8"/></clipPath>
</defs>

<!-- Background -->
<rect width="620" height="450" rx="16" fill="url(#bg)"/>

<!-- Subtle rings -->
<circle cx="310" cy="225" r="105" fill="none" stroke="#0d2244" stroke-width="1" opacity="0.7"/>
<circle cx="310" cy="225" r="175" fill="none" stroke="#0a1830" stroke-width="1" opacity="0.4"/>

<!-- ── CONNECTION LINES ── -->
<!-- center = 310, 225 -->

<!-- → 라이드플럭스 (top-left: 148, 153) -->
<line x1="310" y1="225" x2="148" y2="153"
  stroke="#2563eb" stroke-width="1.8" opacity="0.45"/>
<!-- glow -->
<line x1="310" y1="225" x2="148" y2="153"
  stroke="#60a5fa" stroke-width="0.8" opacity="0.6" filter="url(#gl)"/>
<!-- dot midpoint -->
<circle cx="229" cy="189" r="3.5" fill="#3b82f6" opacity="0.8"/>
<!-- endpoint dot -->
<circle cx="148" cy="153" r="5" fill="#a855f7" opacity="0.9"/>

<!-- → SWM (bottom-left: 148, 298) -->
<line x1="310" y1="225" x2="148" y2="298"
  stroke="#2563eb" stroke-width="1.8" opacity="0.45"/>
<line x1="310" y1="225" x2="148" y2="298"
  stroke="#60a5fa" stroke-width="0.8" opacity="0.6" filter="url(#gl)"/>
<circle cx="229" cy="261" r="3.5" fill="#3b82f6" opacity="0.8"/>
<circle cx="148" cy="298" r="5" fill="#38bdf8" opacity="0.9"/>

<!-- → A2Z (top: 310, 62) -->
<line x1="310" y1="225" x2="310" y2="62"
  stroke="#2563eb" stroke-width="1.8" opacity="0.45"/>
<line x1="310" y1="225" x2="310" y2="62"
  stroke="#60a5fa" stroke-width="0.8" opacity="0.6" filter="url(#gl)"/>
<circle cx="310" cy="143" r="3.5" fill="#3b82f6" opacity="0.8"/>
<circle cx="310" cy="62" r="5" fill="#34d399" opacity="0.9"/>

<!-- → 카카오모빌리티 (top-right: 472, 153) -->
<line x1="310" y1="225" x2="472" y2="153"
  stroke="#f59e0b" stroke-width="1.8" opacity="0.45"/>
<line x1="310" y1="225" x2="472" y2="153"
  stroke="#fbbf24" stroke-width="0.8" opacity="0.6" filter="url(#gl)"/>
<circle cx="391" cy="189" r="3.5" fill="#fbbf24" opacity="0.8"/>
<circle cx="472" cy="153" r="5" fill="#fbbf24" opacity="0.9"/>

<!-- → SUM (bottom-right: 472, 298) -->
<line x1="310" y1="225" x2="472" y2="298"
  stroke="#2563eb" stroke-width="1.8" opacity="0.45"/>
<line x1="310" y1="225" x2="472" y2="298"
  stroke="#60a5fa" stroke-width="0.8" opacity="0.6" filter="url(#gl)"/>
<circle cx="391" cy="261" r="3.5" fill="#3b82f6" opacity="0.8"/>
<circle cx="472" cy="298" r="5" fill="#818cf8" opacity="0.9"/>


<!-- ══ CENTER: 셔클 로고만 (원 없음) ══ -->
<image
  href="https://hyojung-kwon.github.io/public_for_sharing/img/shucle_logo_white.svg"
  x="238" y="198" width="144" height="54"/>


<!-- ══ 라이드플럭스 (top-left) ══ -->
<!-- 흰 배경 (로고가 흰색 SVG이므로 불투명 어두운 박스) -->
<g transform="translate(78,127)">
  <rect width="140" height="52" rx="8"
    fill="#0a0818" stroke="#a855f7" stroke-width="1.4"/>
  <image
    href="https://framerusercontent.com/images/Af0sLimemFcMqesWgSU0iI1FI8Q.svg"
    x="10" y="10" width="120" height="32"
    preserveAspectRatio="xMidYMid meet"/>
</g>


<!-- ══ SWM (bottom-left) ══ -->
<g transform="translate(78,272)">
  <!-- SWM 로고는 다크 계열 → 흰 배경 박스 -->
  <rect width="120" height="52" rx="8"
    fill="#ffffff" stroke="#38bdf8" stroke-width="1.4"/>
  <image
    href="https://swm.ai/theme/basic/img/common/logo.png"
    x="10" y="8" width="100" height="36"
    preserveAspectRatio="xMidYMid meet"/>
</g>


<!-- ══ A2Z (top-center) ══ -->
<g transform="translate(245,36)">
  <rect width="130" height="52" rx="8"
    fill="#04120e" stroke="#34d399" stroke-width="1.4"/>
  <!-- A2Z 로고: 첫번째 이미지 시도, fallback 텍스트 -->
  <image
    href="https://cdn.imweb.me/upload/S202309086909876845cbd/c3fd8c0dbd0c1.png"
    x="5" y="4" width="120" height="44"
    preserveAspectRatio="xMidYMid meet"/>
</g>


<!-- ══ 카카오모빌리티 (top-right) ══ -->
<g transform="translate(392,127)">
  <!-- 카카오 로고 → 흰 배경 -->
  <rect width="160" height="52" rx="8"
    fill="#ffffff" stroke="#fbbf24" stroke-width="1.4"/>
  <image
    href="https://t1.kakaocdn.net/kakaomobility/company_website/images/logo.svg"
    x="10" y="10" width="140" height="32"
    preserveAspectRatio="xMidYMid meet"/>
</g>


<!-- ══ SUM (bottom-right) ══ -->
<g transform="translate(412,272)">
  <rect width="120" height="52" rx="8"
    fill="#06061a" stroke="#818cf8" stroke-width="1.4"/>
  <!-- logo_blank = 흰색 버전 -->
  <image
    href="https://smobi.ai/assets/images/module_contents/logo_blank.png"
    x="10" y="8" width="100" height="36"
    preserveAspectRatio="xMidYMid meet"/>
</g>

</svg>

</body>
</html>
