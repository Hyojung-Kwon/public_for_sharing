<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서울시 자율주행 서비스 — 순환셔틀·마을버스·DRT</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060d18;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 44px;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
      min-height: 100vh;
    }
    h1 { color: #d5e8f5; font-size: 20px; font-weight: 600; margin-bottom: 4px; letter-spacing: -0.3px; }
    .sub { color: #2d4e62; font-size: 12px; margin-bottom: 20px; }
    .map { max-width: 940px; width: 100%; border-radius: 14px; overflow: hidden; box-shadow: 0 16px 56px rgba(0,0,0,0.75); }
    svg { display: block; width: 100%; height: auto; }
    .legend { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px 20px; margin-top: 20px; max-width: 940px; width: 100%; }
    .li { display: flex; align-items: center; gap: 9px; }
    .b { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: #fff; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.15); }
    .lt { color: #aec8dc; font-size: 14px; }
    .ls { color: #6090aa; font-size: 12px; margin-top: 1px; }
  </style>
</head>
<body>

<h1>서울시 자율주행 서비스 현황</h1>
<div class="sub">순환셔틀 · 마을버스 · DRT | 2026. 8. 기준</div>

<div class="map">
<svg viewBox="0 0 920 700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <filter id="gl" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Background -->
<rect width="920" height="700" fill="#0b1825"/>
<rect x="0" y="418" width="920" height="282" fill="#090f1c" opacity="0.45"/>

<!-- Map title -->
<text x="24" y="36" fill="#7aafc8" font-size="15" font-weight="700" letter-spacing="1" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">순환셔틀 · 마을버스 · DRT</text>

<!-- Han River -->
<path d="M 0 422 C 95 406 195 423 330 430 C 440 436 535 422 648 416 C 755 410 845 422 920 418"
      fill="none" stroke="#0c2c42" stroke-width="46" stroke-linecap="round"/>
<path d="M 0 422 C 95 406 195 423 330 430 C 440 436 535 422 648 416 C 755 410 845 422 920 418"
      fill="none" stroke="#0e3450" stroke-width="28" stroke-linecap="round"/>
<text x="768" y="430" fill="#144060" font-size="13" font-style="italic">한 강</text>

<!-- Area labels -->
<text x="478" y="270" fill="#4a8ba4" font-size="15" text-anchor="middle">종로·중구</text>
<text x="352" y="610" fill="#4a8ba4" font-size="15" text-anchor="middle">동작·관악</text>
<text x="108" y="360" fill="#4a8ba4" font-size="15" text-anchor="middle">마포·서대문</text>
<text x="162" y="478" fill="#4a8ba4" font-size="15" text-anchor="middle">영등포</text>
<text x="604" y="490" fill="#4a8ba4" font-size="15" text-anchor="middle">강남·서초</text>
<text x="172" y="152" fill="#4a8ba4" font-size="15" text-anchor="middle">은평</text>
<text x="718" y="138" fill="#4a8ba4" font-size="15" text-anchor="middle">노원</text>

<!-- ⑦ 상암A21 : 월드컵경기장 ↔ DMC역 (Lime green) -->
<path d="M 168 312 L 183 294 L 192 280"
      fill="none" stroke="#84cc16" stroke-width="6" stroke-linecap="round" filter="url(#gl)"/>

<!-- ⑧ 청계A01 : 청계광장 순환 (Orange) -->
<ellipse cx="450" cy="316" rx="33" ry="18"
         fill="none" stroke="#f97316" stroke-width="6" filter="url(#gl)"/>

<!-- ⑨ 동대문A01 : 장한평역 ↔ 경희의료원 (Emerald) -->
<path d="M 545 302 C 567 270 590 250 610 234"
      fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" filter="url(#gl)"/>

<!-- ⑩ 동작A01 : 숭실대 ↔ 중앙대 (Light pink) -->
<path d="M 341 478 L 360 452"
      fill="none" stroke="#f472b6" stroke-width="6" stroke-linecap="round" filter="url(#gl)"/>

<!-- ⑪ 서대문A01 : 가좌역 ↔ 서대문구청 (Fuchsia) -->
<ellipse cx="272" cy="299" rx="31" ry="20"
         fill="none" stroke="#d946ef" stroke-width="6" filter="url(#gl)" transform="rotate(-15 272 299)"/>

<!-- ⑫ 상암A02 DRT : DMC역 일대 (Teal, dashed) -->
<circle cx="192" cy="280" r="26"
        fill="#2dd4bf06" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="5,3" opacity="0.5"/>

<!-- SERVICE LABELS -->
<text x="196" y="305" fill="#84cc16" font-size="15" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">상암A21</text>
<text x="450" y="348" fill="#f97316" font-size="15" text-anchor="middle" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">청계A01</text>
<text x="612" y="250" fill="#10b981" font-size="15" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">동대문A01</text>
<text x="378" y="468" fill="#f472b6" font-size="15" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">동작A01</text>
<text x="272" y="270" fill="#d946ef" font-size="15" text-anchor="middle" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">서대문A01</text>
<text x="192" y="248" fill="#2dd4bf" font-size="15" text-anchor="middle" font-weight="600" paint-order="stroke" stroke="#0b1825" stroke-width="3" stroke-linejoin="round">상암A02 DRT</text>

<!-- STATIONS -->
<circle cx="610" cy="234" r="6" fill="#10b981" stroke="#0b1825" stroke-width="2.5"/>
<text x="624" y="232" fill="#a5c5da" font-size="13">경희의료원</text>

<circle cx="449" cy="315" r="5.5" fill="#f97316" stroke="#0b1825" stroke-width="2"/>
<text x="390" y="312" fill="#a5c5da" font-size="13" text-anchor="end">청계광장</text>

<circle cx="545" cy="302" r="6" fill="#10b981" stroke="#0b1825" stroke-width="2.5"/>
<text x="562" y="272" fill="#a5c5da" font-size="13" opacity="0.85">장한평역</text>

<circle cx="300" cy="285" r="6" fill="#d946ef" stroke="#0b1825" stroke-width="2.5"/>
<text x="314" y="282" fill="#a5c5da" font-size="13">서대문구청</text>

<circle cx="248" cy="312" r="6" fill="#d946ef" stroke="#0b1825" stroke-width="2.5"/>
<text x="230" y="327" fill="#a5c5da" font-size="13" text-anchor="middle">가좌역</text>

<circle cx="192" cy="280" r="6" fill="#2dd4bf" stroke="#0b1825" stroke-width="2.5"/>
<text x="174" y="271" fill="#a5c5da" font-size="13" text-anchor="end">DMC역</text>

<circle cx="168" cy="312" r="6" fill="#84cc16" stroke="#0b1825" stroke-width="2.5"/>
<text x="144" y="344" fill="#a5c5da" font-size="13" text-anchor="end">월드컵경기장</text>

<circle cx="360" cy="452" r="6" fill="#f472b6" stroke="#0b1825" stroke-width="2.5"/>
<text x="374" y="450" fill="#a5c5da" font-size="13">중앙대</text>

<circle cx="341" cy="478" r="6" fill="#f472b6" stroke="#0b1825" stroke-width="2.5"/>
<text x="322" y="494" fill="#a5c5da" font-size="13" text-anchor="middle">숭실대</text>

</svg>
</div>

<div class="legend">
  <div class="li">
    <div class="b" style="background:#84cc16"></div>
    <div><div class="lt">상암A21</div><div class="ls">월드컵경기장 ↔ DMC역 / SUM</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#f97316"></div>
    <div><div class="lt">청계A01</div><div class="ls">청계광장 순환 / A2Z</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#10b981"></div>
    <div><div class="lt">동대문A01</div><div class="ls">장한평역 ↔ 경희의료원 / A2Z</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#f472b6"></div>
    <div><div class="lt">동작A01</div><div class="ls">숭실대 ↔ 중앙대 / SUM</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#d946ef"></div>
    <div><div class="lt">서대문A01</div><div class="ls">가좌역 ↔ 서대문구청 / RideFlux</div></div>
  </div>
  <div class="li">
    <div class="b" style="background:#2dd4bf"></div>
    <div><div class="lt">상암A02 DRT</div><div class="ls">DMC역 ↔ 상암동 주민센터 / SWM</div></div>
  </div>
</div>

</body>
</html>
