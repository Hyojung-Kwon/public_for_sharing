<html lang="en">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #0a0e1a; color: #e0e6f0; height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    header {
      background: linear-gradient(135deg, #002157 0%, #003580 50%, #00254d 100%);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 2px solid #00a8ff44;
      box-shadow: 0 2px 20px rgba(0,168,255,0.15);
      z-index: 1000;
    }
    .logo {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fff;
      text-transform: uppercase;
    }
    .logo span { color: #00a8ff; }
    header h1 {
      font-size: 15px;
      font-weight: 400;
      color: #a0b8d0;
      letter-spacing: 1px;
    }
    .header-stats {
      margin-left: auto;
      display: flex;
      gap: 24px;
    }
    .stat-item {
      text-align: center;
    }
    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: #00a8ff;
      line-height: 1;
    }
    .stat-label {
      font-size: 10px;
      color: #6080a0;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* Layout */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 300px;
      background: #0d1526;
      border-right: 1px solid #1a2a44;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-title {
      padding: 14px 16px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #4a6080;
      border-bottom: 1px solid #1a2a44;
    }

    /* Filter */
    .filter-section {
      padding: 12px 16px;
      border-bottom: 1px solid #1a2a44;
    }
    .filter-label {
      font-size: 10px;
      color: #4a6080;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .filter-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      margin-bottom: 4px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      border: 1px solid transparent;
    }
    .filter-btn:hover { background: #162030; }
    .filter-btn.active { border-color: #1a3050; background: #162030; }
    .filter-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .filter-btn span { font-size: 12px; color: #c0d0e0; }
    .filter-btn .count {
      margin-left: auto;
      background: #1a2a44;
      color: #6090b0;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
    }

    /* Service list */
    .list-section {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .list-section::-webkit-scrollbar { width: 4px; }
    .list-section::-webkit-scrollbar-track { background: transparent; }
    .list-section::-webkit-scrollbar-thumb { background: #1a3050; border-radius: 2px; }

    .list-item {
      padding: 10px 16px;
      border-bottom: 1px solid #111e30;
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item:hover { background: #162030; }
    .list-item.selected { background: #0d2040; border-left: 3px solid #00a8ff; }
    .list-item-name { font-size: 12px; font-weight: 600; color: #d0e0f0; margin-bottom: 2px; }
    .list-item-loc { font-size: 11px; color: #5070a0; }
    .list-item-meta { font-size: 10px; color: #3a5070; margin-top: 3px; }
    .svc-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 9px;
      font-weight: 600;
      margin-right: 4px;
    }

    /* Map */
    #map { flex: 1; }

    /* Popup */
    .leaflet-popup-content-wrapper {
      background: #0d1a2e;
      border: 1px solid #1a3050;
      border-radius: 10px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      color: #c0d0e0;
    }
    .leaflet-popup-tip { background: #0d1a2e; }
    .leaflet-popup-content { margin: 0; min-width: 240px; }
    .popup-header {
      padding: 12px 14px 8px;
      border-bottom: 1px solid #1a3050;
    }
    .popup-svc {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .popup-location {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
    }
    .popup-body { padding: 10px 14px 12px; }
    .popup-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      font-size: 11px;
      border-bottom: 1px solid #0f2030;
    }
    .popup-row:last-child { border-bottom: none; }
    .popup-key { color: #4a6a8a; }
    .popup-val { color: #c0d0e0; text-align: right; max-width: 160px; }
    .popup-link {
      display: block;
      text-align: center;
      padding: 6px;
      margin-top: 8px;
      background: #003580;
      border-radius: 5px;
      color: #60b0ff;
      font-size: 11px;
      text-decoration: none;
    }
    .popup-link:hover { background: #004aa0; color: #90d0ff; }

    /* Legend */
    .legend {
      background: #0d1526cc;
      border: 1px solid #1a2a44;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 11px;
    }
    .legend-title { font-weight: 700; color: #6090b0; margin-bottom: 6px; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .legend-item { display: flex; align-items: center; gap: 6px; margin: 4px 0; color: #a0b8d0; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  </style>
</head>

</div>

let currentFilter = 'all';
let markers = [];
let selectedIdx = null;

function makePopup(d) {
  const color = getColor(d.service);
  const badge = (SERVICE_COLORS[d.service] || { label: d.service }).label;
  const endStr = d.end === 'Running' ? '<span style="color:#10b981">● Running</span>' : d.end;
  const linkHtml = d.url ? `<a class="popup-link" href="${d.url}" target="_blank">App Link →</a>` : '';
  return `
    <div class="popup-header">
      <div class="popup-svc" style="color:${color}">${d.service}</div>
      <div class="popup-location">${d.location}</div>
    </div>
    <div class="popup-body">
      <div class="popup-row"><span class="popup-key">Country</span><span class="popup-val">${d.country}</span></div>
      <div class="popup-row"><span class="popup-key">Operator</span><span class="popup-val">${d.operator}</span></div>
      <div class="popup-row"><span class="popup-key">Vehicle</span><span class="popup-val">${d.vehicle}</span></div>
      <div class="popup-row"><span class="popup-key">Units</span><span class="popup-val">${d.units}</span></div>
      <div class="popup-row"><span class="popup-key">Use Case</span><span class="popup-val">${d.usecase}</span></div>
      <div class="popup-row"><span class="popup-key">Launch</span><span class="popup-val">${d.launch}</span></div>
      <div class="popup-row"><span class="popup-key">Status</span><span class="popup-val">${endStr}</span></div>
      ${linkHtml}
    </div>`;
}

function buildList(filter) {
  const list = document.getElementById('service-list');
  list.innerHTML = '';
  const filtered = filter === 'all' ? DATA : DATA.filter(d => d.service === filter);
  filtered.forEach((d, i) => {
    const globalIdx = DATA.indexOf(d);
    const color = getColor(d.service);
    const div = document.createElement('div');
    div.className = 'list-item';
    div.id = 'list-item-' + globalIdx;
    div.innerHTML = `
      <div class="list-item-name">
        <span class="svc-badge" style="background:${getBg(d.service)};color:${color}">${(SERVICE_COLORS[d.service]||{label:d.service}).label}</span>
        ${d.location.split(',')[0]}
      </div>
      <div class="list-item-loc">${d.location}</div>
      <div class="list-item-meta">🚌 ${d.units} units · ${d.launch}</div>`;
    div.onclick = () => selectMarker(globalIdx);
    list.appendChild(div);
  });
}

function selectMarker(idx) {
  // Deselect previous
  if (selectedIdx !== null) {
    const prevEl = document.getElementById('list-item-' + selectedIdx);
    if (prevEl) prevEl.classList.remove('selected');
  }
  selectedIdx = idx;
  const el = document.getElementById('list-item-' + idx);
  if (el) { el.classList.add('selected'); el.scrollIntoView({ block: 'nearest' }); }

  const d = DATA[idx];
  const m = markers[idx];
  if (m) {
    map.setView([d.lat, d.lon], 13);
    m.openPopup();
  }
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  markers.forEach((m, i) => {
    const d = DATA[i];
    const show = filter === 'all' || d.service === filter;
    if (show) m.addTo(map); else map.removeLayer(m);
  });
  buildList(filter);
  updateStats(filter);
  if (filter === 'all') {
    map.setView([36.5, 127.8], 7);
  }
}

function updateStats(filter) {
  const filtered = filter === 'all' ? DATA : DATA.filter(d => d.service === filter);
  const units = filtered.reduce((s, d) => s + (parseInt(d.units) || 0), 0);
  const countries = new Set(filtered.map(d => d.country)).size;
  document.getElementById('stat-services').textContent = filtered.length;
  document.getElementById('stat-units').textContent = units;
  document.getElementById('stat-countries').textContent = countries;
}

// Count badges
document.getElementById('cnt-all').textContent = DATA.length;
document.getElementById('cnt-dokta').textContent = DATA.filter(d => d.service === '똑타(Dokta)').length;
document.getElementById('cnt-shucle').textContent = DATA.filter(d => d.service === '셔클(Shucle)').length;
document.getElementById('cnt-eeung').textContent = DATA.filter(d => d.service === '이응패스(e-eung pass)').length;

// Init markers
DATA.forEach((d, i) => {
  const shortLoc = d.location.split(',')[0].trim();
  const m = L.marker([d.lat, d.lon], { icon: makeIcon(getColor(d.service), shortLoc) })
    .bindPopup(makePopup(d), { maxWidth: 280 })
    .addTo(map);
  m.on('click', () => selectMarker(i));
  markers.push(m);
});
